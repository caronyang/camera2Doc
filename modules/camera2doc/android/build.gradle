plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.camera2doc'
version = '0.1.0'

android {
  namespace "expo.modules.camera2doc"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'org.opencv:opencv:4.14.0'
  implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
